# Explicit HTTP invitation-testing gateway. This port is unencrypted.
# Activate only after the owner confirms public HTTP access.
# Keep the backend on loopback; leave existing port-80 sites unchanged.
server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HTTP browsers cannot return Secure cookies. Limit this exception
        # to this gateway; retain HttpOnly and SameSite=Strict.
        proxy_cookie_flags mvp_session nosecure;
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肺癌报告分析</title><link rel="stylesheet" href="/static/style.css?v=20261002"><link rel="stylesheet" href="/static/knowledge.css?v=20261002"></head>
<body>
<header class="app-header"><a href="#" class="brand"><span class="brand-mark">L<span>+</span></span><span data-i18n="title">肺癌报告分析</span></a><div class="header-actions"><button id="logout-button" class="button ghost" hidden>退出</button><a id="knowledge-nav" class="button ghost" href="/knowledge" target="_blank" rel="noopener">证据图谱</a><div class="language-switch" aria-label="Language"><button id="lang-zh" lang="zh-CN">中文</button><button id="lang-en" lang="en">EN</button></div><button id="settings-top" class="button ghost" data-i18n="settings">设置</button></div></header>
<main>
<section class="page-heading"><div><h1 data-i18n="title">肺癌报告分析</h1><p data-i18n="tagline">上传报告，核对特征，查看结果。</p></div><button id="demo-button" class="button secondary" data-i18n="demo">查看示例</button></section>
<nav class="steps"><a href="#input-section"><span>1</span><b data-i18n="input">添加报告</b></a><i>→</i><a href="#features-section"><span>2</span><b data-i18n="features">核对特征</b></a><i>→</i><a href="#risk-section"><span>3</span><b data-i18n="result">评估结果</b></a></nav>
<div id="demo-banner" class="demo-banner hidden"><span data-i18n="demoNotice">虚构示例 · 概率为演示数字，不是患者预测</span><button id="exit-demo" data-i18n="exitDemo">退出示例</button></div>
<div class="work-grid">
<section class="panel input-panel" id="input-section"><div class="panel-title"><h2 data-i18n="input">添加报告</h2><span id="report-count" class="badge"></span></div>
<div class="input-row"><label><span data-i18n="case">病例编号</span><input id="case-label" maxlength="80" data-placeholder="casePlaceholder" placeholder="例如 LC-001"></label><label><span data-i18n="modality">报告类型</span><select id="modality"><option value="PATH">术后病理</option><option value="CE">增强CT</option><option value="NCE">平扫CT</option><option value="PET_CT">PET-CT</option></select></label></div>
<div class="input-tabs"><button id="text-tab" class="selected" data-i18n="textTab">粘贴文字</button><button id="file-tab" data-i18n="fileTab">上传文件</button></div>
<div id="text-input"><textarea id="report-text" rows="6" maxlength="60000" data-placeholder="textPlaceholder" placeholder="在这里粘贴报告所见与结论…"></textarea><div class="text-actions"><span id="char-count"></span><button class="button secondary" id="add-text" data-i18n="add">加入列表</button></div></div>
<div id="file-input" class="hidden"><label class="dropzone" id="dropzone" for="file-picker"><span class="upload-icon">↥</span><strong data-i18n="drop">拖入报告，或点击选择</strong><span data-i18n="formats">PDF、PNG、JPG、TXT · 单份≤10MB</span><input id="file-picker" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" multiple></label><details class="advanced"><summary data-i18n="advanced">上传选项</summary><label class="check"><input type="checkbox" id="force-ocr"><span data-i18n="forceOCR">PDF强制图片识别</span></label><p data-i18n="pdfLimit"></p></details></div>
<div id="report-list" class="report-list"></div><button class="button primary full" id="analyze-button" data-i18n="analyze">提取特征</button><div id="progress" class="progress hidden" role="status"><span class="spinner"></span><span id="progress-text"></span></div>
<div class="input-footer"><button id="provider-status" class="link-button"></button><details><summary data-i18n="help">说明</summary><p data-i18n="transfer"></p></details></div></section>
<section class="panel risk-panel" id="risk-section"><div class="panel-title"><h2 data-i18n="result">评估结果</h2><span id="risk-badge" class="badge"></span></div><div id="single-risk" class="risk-main"><div><div id="risk-percent" class="risk-number">—</div><div id="risk-horizon" class="risk-label"></div></div><div class="risk-icon" aria-hidden="true">↗</div></div><div id="multihorizon-risk" class="risk-years hidden"></div><p id="multi-origin" class="result-context hidden"></p><p id="risk-description" class="risk-description"></p><div id="risk-track" class="risk-track"><span id="risk-fill"></span></div><div class="sites-heading"><h3 id="sites-heading-title" data-i18n="sites">三个可能的复发部位</h3><span id="sites-units" data-i18n="absolute">绝对概率</span></div><div id="site-cards" class="site-cards"></div><p id="site-rank-note" class="muted hidden"></p><details class="result-details"><summary data-i18n="riskInfo">模型与结果说明</summary><p id="risk-note"></p><p id="risk-model"></p><p id="model-horizon"></p><div id="conditional-sites"></div><p id="validation-summary"></p><p id="risk-drivers"></p></details></section>
</div>
<section id="knowledge-case" class="panel hidden"></section>
<section id="report-review" class="panel report-review hidden" aria-live="polite"></section>
<section class="panel feature-panel" id="features-section"><div class="panel-title"><div><h2 data-i18n="features">核对特征</h2><p id="feature-summary" class="muted"></p></div><div class="button-group"><button id="export-csv" class="button secondary" disabled data-i18n="csv">导出CSV</button><button id="export-json" class="button secondary" disabled data-i18n="json">导出JSON</button><button id="print-button" class="button ghost" disabled data-i18n="print">打印</button></div></div>
<div class="feature-toolbar"><div id="modality-filters" class="filter-tabs"><button data-filter="ALL" class="selected" data-i18n="all">全部</button><button data-filter="CE">CE</button><button data-filter="NCE">NCE</button><button data-filter="PET_CT">PET-CT</button><button data-filter="PATH" data-i18n="PATH">术后病理</button></div><div class="table-tools"><input id="feature-search" data-placeholder="search" placeholder="搜索特征"><label class="check"><input id="show-missing" type="checkbox"><span data-i18n="showMissing">显示未报告</span></label></div></div>
<div class="table-scroll"><table><thead><tr><th data-i18n="columnType">类型</th><th data-i18n="columnFeature">特征</th><th data-i18n="columnValue">编码 / 可修正</th><th data-i18n="columnMeaning">含义</th><th data-i18n="columnState">状态</th><th data-i18n="columnSource">原文</th></tr></thead><tbody id="feature-body"></tbody></table></div>
<div id="review-footer" class="review-footer hidden"><div><label class="check"><input id="review-confirmed" type="checkbox"><span data-i18n="reviewConfirm">已对照原文核对特征</span></label><p id="automatic-model" class="automatic-model"></p><p id="model-selection-note" class="muted"></p><label id="scope-label" class="check"><input id="scope-confirmed" type="checkbox"><span data-i18n="scopeConfirm">符合模型适用人群</span></label><details class="compact-details"><summary data-i18n="scope">适用范围</summary><p id="scope-description" class="muted"></p></details></div><button id="predict-button" class="button primary" disabled data-i18n="predict">保存并评估</button></div>
<div class="feature-details"><details><summary data-i18n="legendTitle">编码说明</summary><p data-i18n="legend"></p></details><details id="source-details"><summary data-i18n="reportsTitle">报告原文</summary><div id="routing-list"></div></details></div></section>
<footer><span data-i18n="footer">仅供研究，不用于诊疗决策。</span><button id="clear-all" class="link-button" data-i18n="clear">清除病例</button></footer></main>
<dialog id="settings-dialog"><form id="settings-form"><div class="modal-head"><h2 data-i18n="settingsTitle">接口设置</h2><button type="button" class="icon-button" data-close="settings-dialog">×</button></div><fieldset id="provider-fields"><legend data-i18n="unifiedProvider">DeepSeek · 文字与图片</legend><label><span data-i18n="baseURL">接口地址</span><input name="base_url" type="url" required maxlength="2048" placeholder="https://api.deepseek.com"></label><label><span data-i18n="modelName">模型名</span><input name="model" required maxlength="200" placeholder="deepseek-flash"></label><label><span data-i18n="apiKey">API密钥</span><input name="api_key" type="password" autocomplete="off" maxlength="4096" data-placeholder="keepKey"></label></fieldset><div class="capability-actions"><button type="button" id="test-provider" class="button secondary" data-i18n="testCapability">测试连接与能力</button><span id="capability-summary" role="status" aria-live="polite"></span></div><div id="capability-results" class="capability-results hidden" aria-live="polite"></div><p class="muted" data-i18n="probeNote"></p><details class="compact-details"><summary data-i18n="help">说明</summary><p data-i18n="settingsNote"></p></details><details><summary data-i18n="riskInfo"></summary><p id="model-details"></p></details><div class="modal-actions"><button type="button" class="button secondary" data-close="settings-dialog" data-i18n="cancel">取消</button><button type="submit" class="button primary" data-i18n="save">保存设置</button></div></form></dialog>
<dialog id="evidence-dialog"><div class="modal-head"><h2 id="evidence-title"></h2><button class="icon-button" data-close="evidence-dialog">×</button></div><div id="evidence-content"></div></dialog>
<div id="toast" class="toast hidden" role="alert"></div><script src="/static/session.js?v=20261002"></script><script src="/static/i18n.js?v=20261002"></script><script src="/static/graph-renderer.js?v=20261002"></script><script src="/static/knowledge-case.js?v=20261002"></script><script src="/static/app.js?v=20261002"></script></body></html>

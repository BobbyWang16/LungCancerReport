<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告证据图谱</title><link rel="stylesheet" href="/static/style.css?v=20261002"><link rel="stylesheet" href="/static/knowledge.css?v=20261002"></head>
<body><header class="app-header"><a class="brand" href="/"><span class="brand-mark">L<span>+</span></span><span id="kg-brand">报告证据图谱</span></a><div class="header-actions"><button id="logout-button" class="button ghost" hidden>退出</button><a class="button ghost" href="/" id="kg-back">返回报告分析</a><div class="language-switch"><button id="kg-zh">中文</button><button id="kg-en">EN</button></div></div></header>
<main class="kg-main"><section class="page-heading"><div><div class="kg-eyebrow">LC · EVIDENCE ATLAS</div><h1 id="kg-title">让报告信息与证据连接</h1><p id="kg-subtitle">从一个特征出发，查看跨模态关联、阅读优先级与适用范围。</p></div><button class="button secondary" id="kg-export">导出当前证据</button></section>
<div id="kg-stats" class="kg-stats"></div><div id="kg-error" role="alert" class="hidden"></div>
<nav class="kg-view-tabs" id="kg-view-tabs"><button data-view="overview">全局图谱</button><button data-view="weights">权重地图</button><button data-view="matrix">证据矩阵</button><button data-view="detail">特征详情</button></nav>
<section id="kg-overview-view" class="kg-view panel"><div class="panel-title"><div><h2 id="kg-overview-title">跨模态证据全景</h2><p id="kg-overview-sub" class="kg-quiet"></p></div><div class="button-group"><button id="kg-zoom-in" class="button ghost">＋</button><button id="kg-zoom-out" class="button ghost">−</button><button id="kg-reset" class="button secondary">复位</button><button id="kg-svg" class="button secondary">导出SVG</button></div></div><div class="kg-filters"><select id="kg-global-pop"><option>ALL</option><option>LUAD</option><option>LUSC</option><option>SCLC</option></select><select id="kg-global-policy"><option value="best">优先调整证据</option><option value="adjusted">仅调整秩关联</option><option value="raw">原始关联</option></select><label class="check"><input id="kg-all-nodes" type="checkbox"><span id="kg-all-nodes-label">显示全部210个字段</span></label></div><div class="kg-graph-scroll"><svg id="kg-global-network" viewBox="0 0 1120 660"></svg></div><div id="kg-global-note" class="kg-quiet"></div><div id="kg-visual-detail" class="kg-inspect"></div><details class="compact-details"><summary id="kg-coverage-toggle">报告覆盖</summary><div id="kg-report-coverage" class="kg-report-coverage"></div></details></section>
<section id="kg-weights-view" class="kg-view panel hidden"><div class="panel-title"><h2 id="kg-weight-title">关联与预后：两个重要性维度</h2><span class="badge" id="kg-weight-count"></span></div><div class="kg-weight-control"><label for="kg-alpha" id="kg-alpha-label">跨模态关注比例</label><input id="kg-alpha" type="range" min="0" max="100" step="25" value="50"><strong id="kg-alpha-value">50% / 50%</strong></div><div class="kg-map-scroll"><svg id="kg-weight-map" viewBox="0 0 1000 550"></svg></div><details class="compact-details"><summary id="kg-weight-method">权重说明</summary><p id="kg-weight-note" class="kg-quiet"></p></details><div id="kg-weight-ranking" class="kg-report-coverage"></div></section>
<section id="kg-matrix-view" class="kg-view panel hidden"><div class="panel-title"><h2 id="kg-matrix-title">影像—病理证据矩阵</h2><span class="badge" id="kg-matrix-count"></span></div><div class="kg-filters"><select id="kg-matrix-mod"><option>CE</option><option>NCE</option><option value="PET_CT">PET-CT</option></select><select id="kg-matrix-pop"><option>ALL</option><option>LUAD</option><option>LUSC</option><option>SCLC</option></select><select id="kg-matrix-measure"><option value="partial_rank_rho">调整ρ</option><option value="spearman_rho">原始ρ</option><option value="bias_corrected_cramers_v">Cramér V</option><option value="epsilon_squared">epsilon²</option></select></div><div id="kg-matrix-summary" class="evidence-summary"></div><div class="kg-matrix-scroll"><svg id="kg-evidence-matrix"></svg></div><div id="kg-matrix-note" class="matrix-legend"></div></section>
<div id="kg-detail-view" class="kg-view hidden"><div class="kg-layout"><aside class="panel kg-sidebar"><label id="kg-search-label" for="kg-search">查找特征或病理分组</label><input id="kg-search" type="search" placeholder="STAS、毛刺、LUSC…"><div class="kg-input-row"><select id="kg-type" aria-label="Node type"><option value="feature">报告特征</option><option value="histology">病理分组</option><option value="model">预测模型</option><option value="outcome">复发结局</option><option value="migration">分期变化</option></select><select id="kg-mod" aria-label="Modality"><option value="ALL">所有报告</option><option>PATH</option><option>CE</option><option>NCE</option><option>PET_CT</option></select></div><div id="kg-nodes" class="kg-nodes" aria-label="Concept list"></div></aside>
<div class="kg-work"><section class="panel kg-focus"><div class="panel-title"><div><span id="kg-selected-kind" class="kg-eyebrow"></span><h2 id="kg-selected-title"></h2></div><span id="kg-selected-code" class="badge"></span></div><div id="kg-priorities" class="kg-priorities"></div><div id="kg-description"></div><details class="kg-dictionary"><summary id="kg-dict-title">编码与适用性</summary><div id="kg-dictionary"></div></details></section>
<section class="panel kg-network-panel"><div class="panel-title"><h2 id="kg-relations-title">证据关系</h2><span id="kg-count" class="badge"></span></div><div class="kg-filters"><select id="kg-relation" aria-label="Evidence type"></select><select id="kg-stratum" aria-label="Evidence population"></select><label class="check"><input type="checkbox" id="kg-significant" checked><span id="kg-significant-label">仅显示 q&lt;0.05 的统计关联</span></label></div><div class="kg-network-scroll"><svg id="kg-network" viewBox="0 0 900 400" role="img" aria-label="Selected evidence neighborhood"></svg></div><p class="muted" id="kg-network-note"></p><div id="kg-table" class="table-scroll"></div><button class="button ghost hidden" id="kg-more"></button></section>
<section class="panel kg-detail" id="kg-detail"><h2 id="kg-detail-title">点击关系查看统计证据</h2><div id="kg-detail-body"></div></section><section class="panel" id="kg-path-panel"><div class="panel-title"><h2 id="kg-path-title">跨模态证据链</h2><button id="kg-path-load" class="button secondary">查询两步证据</button></div><div id="kg-path-body"></div></section></div></div>
</div><details class="panel kg-methods"><summary id="kg-methods-title">图谱如何建立与使用</summary><div id="kg-methods-body"></div></details>
<footer id="kg-footer">研究证据导航 · 关联不代表因果</footer></main><script src="/static/session.js?v=20261002"></script><script src="/static/i18n.js?v=20261002"></script><script src="/static/graph-renderer.js?v=20261002"></script><script src="/static/knowledge.js?v=20261002"></script><script src="/static/evidence-matrix.js?v=20261002"></script><script src="/static/knowledge-visual.js?v=20261002"></script></body></html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告证据</title><link rel="stylesheet" href="/static/style.css?v=20261002b"><link rel="stylesheet" href="/static/knowledge.css?v=20261002b"></head>
<body>
<header class="app-header"><a class="brand" href="/"><span class="brand-mark">L<span>+</span></span><span id="kg-brand">报告证据</span></a><div class="header-actions"><button id="logout-button" class="button ghost" hidden>退出</button><a class="button ghost" href="/" id="kg-back">返回分析</a><div class="language-switch"><button id="kg-zh">中文</button><button id="kg-en">EN</button></div></div></header>
<main class="kg-main">
<section class="page-heading"><h1 id="kg-title">报告证据</h1><button class="button secondary hidden" id="kg-export">导出证据</button></section>
<div id="kg-error" role="alert" class="hidden"></div>
<nav class="kg-view-tabs" id="kg-view-tabs" aria-label="Evidence navigation"><button data-view="weights"><span class="kg-step">1</span><span data-view-label>报告重点</span></button><button data-view="overview"><span class="kg-step">2</span><span data-view-label>跨模态关联</span></button><button data-view="detail"><span class="kg-step">3</span><span data-view-label>统计证据</span></button></nav>
<div id="kg-association-tools" class="kg-association-tools hidden"><div class="kg-segment"><button data-association-view="overview">关系图</button><button data-association-view="matrix">关联热图</button></div></div>
<section id="kg-weights-view" class="kg-view panel">
 <div class="panel-title"><h2 id="kg-weight-title">哪些特征值得关注</h2><span class="badge" id="kg-pooled-label">全队列</span></div>
 <div class="kg-priority-modes kg-segment" aria-label="Priority dimension"><button data-priority-mode="joint">综合重点</button><button data-priority-mode="association">跨模态关联</button><button data-priority-mode="recurrence">复发预测</button></div>
 <div id="kg-priority-ranking" class="kg-priority-ranking"></div>
 <details class="compact-details kg-comparison"><summary id="kg-compare-title">双维度对照</summary><div class="kg-weight-control"><label for="kg-alpha" id="kg-alpha-label">关联 / 复发</label><input id="kg-alpha" type="range" min="0" max="100" step="25" value="50"><strong id="kg-alpha-value">50% / 50%</strong></div><div class="kg-map-scroll"><svg id="kg-weight-map" viewBox="0 0 1000 550"></svg></div><div id="kg-weight-info" class="kg-inspect kg-quiet"></div></details>
 <details class="compact-details"><summary id="kg-weight-method">权重说明</summary><p id="kg-weight-note"></p></details>
</section>
<section id="kg-overview-view" class="kg-view panel hidden">
 <div class="panel-title"><h2 id="kg-overview-title">影像与病理如何关联</h2><div class="button-group"><button id="kg-zoom-in" class="button ghost" aria-label="Zoom in">＋</button><button id="kg-zoom-out" class="button ghost" aria-label="Zoom out">−</button><button id="kg-reset" class="button secondary">复位</button></div></div>
 <div class="kg-filters"><select id="kg-global-pop" aria-label="Histology group"><option value="ALL">全部病理</option></select><details class="kg-display-options"><summary id="kg-display-options-label">显示选项</summary><div><select id="kg-global-policy" aria-label="Association policy"><option value="best">优先调整证据</option><option value="adjusted">仅调整秩关联</option><option value="raw">原始关联</option></select><label class="check"><input id="kg-all-nodes" type="checkbox"><span id="kg-all-nodes-label">全部特征</span></label><button id="kg-svg" class="button secondary">导出SVG</button><p id="kg-graph-method"></p></div></details></div>
 <div class="kg-graph-scroll"><svg id="kg-global-network" viewBox="0 0 1120 660"></svg></div><div id="kg-global-note" role="status" class="hidden"></div><div id="kg-visual-detail" class="kg-inspect"></div>
</section>
<section id="kg-matrix-view" class="kg-view panel hidden">
 <div class="panel-title"><h2 id="kg-matrix-title">关联强度</h2><span class="badge" id="kg-matrix-count"></span></div>
 <div class="kg-filters"><select id="kg-matrix-mod" aria-label="Report type"><option>CE</option><option>NCE</option><option value="PET_CT">PET-CT</option></select><select id="kg-matrix-pop" aria-label="Histology group"><option value="ALL">全部病理</option></select><select id="kg-matrix-measure" aria-label="Association measure"><option value="partial_rank_rho">调整ρ</option><option value="spearman_rho">原始ρ</option><option value="bias_corrected_cramers_v">Cramér V</option><option value="epsilon_squared">ε²</option></select></div>
 <div id="kg-matrix-summary" class="evidence-summary"></div><div class="kg-matrix-scroll"><svg id="kg-evidence-matrix"></svg></div><div id="kg-matrix-note" class="matrix-legend"></div><div id="kg-matrix-info" class="kg-inspect kg-quiet"></div>
</section>
<div id="kg-detail-view" class="kg-view hidden"><div class="kg-layout">
 <aside class="panel kg-sidebar"><label id="kg-search-label" for="kg-search">查找特征</label><input id="kg-search" type="search" placeholder="STAS、毛刺、LUSC…"><div class="kg-input-row"><select id="kg-type" aria-label="Node type"><option value="feature">报告特征</option><option value="histology">病理分组</option><option value="model">预测模型</option><option value="outcome">复发结局</option><option value="migration">分期变化</option></select><select id="kg-mod" aria-label="Modality"><option value="ALL">所有报告</option><option>PATH</option><option>CE</option><option>NCE</option><option>PET_CT</option></select></div><div id="kg-nodes" class="kg-nodes" aria-label="Concept list"></div></aside>
 <div class="kg-work">
 <section class="panel kg-focus"><div class="panel-title"><div><span id="kg-selected-kind" class="kg-eyebrow"></span><h2 id="kg-selected-title"></h2></div></div><div id="kg-priorities" class="kg-priorities"></div><div id="kg-description"></div><details class="kg-dictionary"><summary id="kg-dict-title">编码与适用性</summary><span id="kg-selected-code" class="badge"></span><div id="kg-dictionary"></div></details></section>
 <section class="panel kg-network-panel"><div class="panel-title"><h2 id="kg-relations-title">关联证据</h2><span id="kg-count" class="badge"></span></div><div class="kg-filters"><select id="kg-relation" aria-label="Evidence type"></select><select id="kg-stratum" aria-label="Evidence population"></select><label class="check"><input type="checkbox" id="kg-significant" checked><span id="kg-significant-label">显著关联</span></label></div><div id="kg-table" class="table-scroll"></div><button class="button ghost hidden" id="kg-more"></button><details class="compact-details"><summary id="kg-neighborhood-title">关系图</summary><div class="kg-network-scroll"><svg id="kg-network" viewBox="0 0 900 400" role="img" aria-label="Selected evidence neighborhood"></svg></div><p id="kg-network-note"></p></details></section>
 <section class="panel kg-detail" id="kg-detail"><h2 id="kg-detail-title">统计结果</h2><div id="kg-detail-body"></div></section>
 <details class="panel" id="kg-path-panel"><summary id="kg-path-title">延伸证据</summary><button id="kg-path-load" class="button secondary">查询两步证据</button><div id="kg-path-body"></div></details>
 </div></div></div>
<details class="panel kg-methods"><summary id="kg-methods-title">数据与方法</summary><div id="kg-stats" class="kg-stats"></div><div id="kg-methods-body"></div></details>
<footer id="kg-footer">仅供研究</footer>
</main>
<script src="/static/session.js?v=20261002b"></script><script src="/static/i18n.js?v=20261002b"></script><script src="/static/graph-renderer.js?v=20261002b"></script><script src="/static/priority-selection.js?v=20261002b"></script><script src="/static/knowledge.js?v=20261002b"></script><script src="/static/evidence-matrix.js?v=20261002b"></script><script src="/static/knowledge-visual.js?v=20261002b"></script>
</body></html>
